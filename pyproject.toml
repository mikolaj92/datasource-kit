[project]
name = "datasource-kit"
version = "0.14.3"
description = "Generic, dependency-free toolkit for managing many datasources (batch reference-data updaters and long-running scraper workers)."
# Floor rationale - do NOT relax to 3.11:
# * deliberate policy floor matching current consumers;
# * not a syntax requirement, but the kit stays free to use 3.12 idioms;
# * core remains dependency-free and must not constrain heavier consumers.
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[project.scripts]
datasource-kit = "datasource_kit.cli:main"

[project.optional-dependencies]
# Blob/artifact resolution and in-process journal recording only.
# Fala is GitHub-only (name = "fala"); the PEP 508 URL keeps pip off the
# unrelated PyPI project of the same name. Adapter needs record_in_process
# (Fala 0.7.28+).
fala = ["fala @ git+https://github.com/mikolaj92/Fala.git@v0.7.28"]
# YAML profile loading only; JSON profiles are the dep-free default.
profiles = ["pyyaml>=6.0"]
# Optional FastAPI control-plane router; the core stays HTTP-framework-free.
fastapi = ["fastapi"]
# Published extra so `uv run --extra dev pytest` can resolve the suite.
# The matching dependency-group keeps CI (`uv run --group dev`) unchanged.
dev = ["pytest>=8.0", "fastapi", "httpx"]

[dependency-groups]
dev = ["pytest>=8.0", "fastapi", "httpx"]

[tool.uv.sources]
fala = { git = "https://github.com/mikolaj92/Fala", tag = "v0.7.28" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/datasource_kit"]
